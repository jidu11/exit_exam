<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Exit Exam Ultimate | Electrical & Electronics Engineering | 700 Questions</title>
  <script src="https://cdn.tailwindcss.com"></script>

   <style>
     body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 100%);
      min-height: 100vh;
    }
    /* Hero Background Container - permanent image behind header text */
     .hero-bg-container {
  position: relative;
  border-radius: 2rem;
  margin-bottom: 2rem;
  overflow: hidden;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}
    /* Permanent background image area behind header text */
     .hero-image-area {
  position: absolute;
  inset: 0;

  /* CHANGE THIS PATH */
  background-image: url('./images/cyber.jpg');

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  border-radius: 2rem;
  z-index: 0;
}
    /* Dark overlay for text readability */
    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(10, 15, 30, 0.7), rgba(15, 23, 42, 0.8));
      border-radius: 2rem;
      z-index: 1;
    }
    /* Content sits above the image and overlay */
    .hero-content {
      position: relative;
      z-index: 2;
      padding: 3rem 1.5rem;
    }
    .option-btn { transition: all 0.2s ease; }
    .option-btn:active:not(:disabled) { transform: scale(0.98); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 10px; }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .progress-bar { transition: width 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
    .card-glow { box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5); }
    /* Glassmorphism for cards */
    .glass-card {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(99, 102, 241, 0.35);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.7);
      transform: translateY(-2px);
    }
    .glass-header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(71, 85, 105, 0.5);
    }
    /* Animated gradient text for title */
    .gradient-text {
      background: linear-gradient(135deg, #a5f3fc 0%, #c084fc 40%, #f0abfc 80%, #a5f3fc 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }
    @keyframes shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    /* Badge styling */
    .hero-badge {
      background: rgba(99, 102, 241, 0.25);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(99, 102, 241, 0.5);
      display: inline-block;
      padding: 0.25rem 1rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
   </style>
   
</head>
<body class="antialiased">
  <div id="appRoot" class="min-h-screen w-full py-6 px-4 md:px-8"></div>

   <script src="ee.js"></script>
</body>
</html>
